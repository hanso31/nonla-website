# =====================================================================
# Speisekarte Alte Markthalle – Inhalte
# =====================================================================
# Hier stehen alle Texte und Gerichte der Seite
# "speisekarte-markthalle.html" (Standort Alte Markthalle).
#
# So editierst du diese Datei:
# - Jeder Eintrag hat einen deutschen ("de") und einen englischen
#   ("en") Text. Texte immer in doppelten Anführungszeichen lassen.
# - "<br/>" steht für einen Zeilenumbruch auf der Website und muss
#   genau so stehen bleiben.
# - "&amp;" ist das &-Zeichen und muss genau so stehen bleiben.
# - Das Feld "id" bei Kategorien und Gerichten ist ein stabiler
#   interner Schlüssel (steht z. B. als data-i18n="mk.a1" im HTML).
#   Bitte NIEMALS ändern, sonst gehen die Übersetzungen verloren.
# - "preis_leerzeile: true" erzeugt eine absichtlich leere Preiszeile
#   (Abstandshalter im Layout) – nicht entfernen.
# - Bei "tags_de"/"tags_en" stehen die Abkürzungen:
#   vt = vegetarisch, vg = vegan.
#
# Bilder liegen im Ordner images/ und werden hier nur verlinkt.

prefix: mk
codes: true   # diese Karte hat eine Code-Spalte (A1, B2 ...)

texte:
  crumb: {de: "Speisekarte Alte Markthalle", en: "Menu Old Market Hall"}
  eyebrow: {de: "Streetfood · Take away", en: "Streetfood · Take away"}
  title: {de: "Alte Markthalle", en: "Old Market Hall"}
  lead: {de: "Vietnamesische Streetfood-Klassiker in der Markthalle Basel – 3 Minuten vom Bahnhof SBB. Alles frisch zubereitet, zum Mitnehmen oder vor Ort im Markthallen-Ambiente.", en: "Vietnamese street food classics in the Basel Market Hall – 3 minutes from SBB station. Everything freshly prepared, to take away or enjoy on site in the market hall atmosphere."}
  legend1: {de: "vegan möglich, bitte informieren Sie uns wenn gewünscht.", en: "vegan possible, please let us know if desired."}
  legend2: {de: "Wann immer möglich kochen wir gerne glutenfrei. Bitte informieren Sie uns über bekannte Allergien.", en: "Whenever possible, we are happy to cook gluten-free. Please inform us of any known allergies."}
  order: {de: "Online bestellen", en: "Order online"}
  all-loc: {de: "Alle Standorte", en: "All locations"}

