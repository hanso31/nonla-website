# ============================================================
# Abendkarte Spalenbrunnen (à la carte, abends & samstags)
# ============================================================
# In dieser Datei stehen alle Texte der Seite
# "speisekarte-spalenbrunnen-abend.html": Seitentexte (unten bei
# "texte"), die 7 Kategorien und alle Gerichte mit Preisen,
# Varianten und Kennzeichnungen.
#
# So bearbeitest du diese Datei:
# - Texte immer zwischen den Anführungszeichen ändern.
# - "de" = deutscher Text, "en" = englischer Text.
# - <br/> steht für einen Zeilenumbruch und muss erhalten bleiben.
# - &amp; steht für ein &-Zeichen und muss erhalten bleiben.
# - Die "id"-Felder sind stabile Schlüssel für die Übersetzung –
#   bitte NIE umbenennen, sonst gehen die Verknüpfungen verloren.
# - "layout: bild" = Gericht mit Foto, "layout: einfach" = ohne Foto.
# - "preis" fehlt absichtlich bei manchen Gerichten (dann erscheint
#   keine Preiszeile) – bitte nicht ergänzen.
# - Kennzeichnungen: vt = vegetarisch, vg = vegan, vgm = vegan möglich.

prefix: sa
codes: false

texte:
  crumb:    {de: "Speisekarte Spalenbrunnen abends", en: "Menu Spalenbrunnen dinner"}
  eyebrow:  {de: "À la carte · Abend &amp; Samstag", en: "À la carte · evening &amp; Saturday"}
  title:    {de: "Spalenbrunnen abends", en: "Spalenbrunnen dinner"}
  lead:     {de: "Am Abend und samstags ganztags serviert Ihnen unser Team in gemütlichem Ambiente köstliche Gerichte aus unserer Küche an den Tisch. Reservationen nehmen wir gerne online entgegen – wir freuen uns auf Ihren Besuch.", en: "In the evening and all day on Saturdays, our team serves delicious dishes from our kitchen at your table in a cosy atmosphere. We gladly accept reservations online – we look forward to your visit."}
  note1:    {de: "Wann immer möglich kochen wir gerne glutenfrei. Bitte informieren Sie uns über bekannte Allergien. Unsere Servicemitarbeiter:innen beraten Sie gerne.", en: "Whenever possible, we are happy to cook gluten-free. Please inform us of any known allergies. Our service staff will be happy to advise you."}
  note2:    {de: "Alle Preise inkl. 8,1% MwSt.", en: "All prices incl. 8.1% VAT."}
  note3:    {de: "Fleisch- und Fischherkunft: Rindfleisch, Poulet: Schweiz · Ente: Thailand · Crevetten: Vietnam.", en: "Origin of meat and fish: beef, chicken: Switzerland · duck: Thailand · shrimp: Vietnam."}
  note4:    {de: "WLAN: NonLa Gast · Passwort: nonla2020", en: "Wi-Fi: NonLa Gast · Password: nonla2020"}
  original: {de: "Original-Menükarte als Bild (Vorder- &amp; Rückseite)", en: "Original menu card as image (front &amp; back)"}
  reserve:  {de: "Tisch reservieren", en: "Reserve a table"}
  to-lunch: {de: "Zum Mittagsmenü (Mo–Fr)", en: "To the lunch menu (Mon–Fri)"}

