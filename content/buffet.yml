# =============================================================================
# MITTAGSBUFFET SPALENBRUNNEN - Wochenkarte (Montag bis Freitag)
# =============================================================================
# DIESE DATEI IST DIE WICHTIGSTE FUER DEN TAGESBETRIEB:
# Hier stehen die Buffet-Gerichte der Wochenkarte, die auf der Seite
# "Mittagsmenu Spalenbrunnen" angezeigt werden.
#
# Aufbau: Fuer jeden Wochentag (mo, di, mi, do, fr) gibt es fuenf Gerichte.
# Pro Gericht steht der deutsche Text (de), die englische Uebersetzung (en)
# und jeweils eine Unterzeile (sub_de / sub_en), z. B. die Fleisch-/Tofu-Wahl.
#
# So bearbeiten Sie diese Datei:
#   - Texte stehen immer in Anfuehrungszeichen: de: "Text hier"
#   - Die Einrueckung mit Leerzeichen muss exakt so bleiben wie jetzt.
#   - <br/>  erzeugt einen Zeilenumbruch - bitte stehen lassen
#   - &amp;  ist das &-Zeichen - bitte stehen lassen
#   - Die Felder "id" (mo, di, mi, do, fr) bitte NIEMALS aendern - die
#     Website und die Uebersetzungen haengen an diesen stabilen Schluesseln.
#   - Der Preis steht je Tag im Feld "preis" (z. B. "17.– | 18.– CHF").
#   - Umlaute und vietnamesische Woerter bleiben ganz normal stehen.
# =============================================================================

tage:
