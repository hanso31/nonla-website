- schluessel: about.eyebrow
  de: Über uns
  en: About us
- schluessel: about.title
  de: Chào & herzlich willkommen.
  en: Chào & welcome.
- schluessel: about.p1
  de: Nón Lá ist in Basel zu Hause – im eindrucksvollen, einzigartigen Ambiente der Alten Markthalle, am Spalenbrunnen und im Klara zwischen Messe und Claraplatz. Bei uns finden Sie an allen drei Standorten eine grosse Auswahl an frisch zubereiteten, authentischen vietnamesischen Speisen.
  en: Nón Lá is at home in Basel – in the impressive, unique ambience of the Old Market Hall, at Spalenbrunnen and at Klara, between Messe Basel and Claraplatz. At all three locations you will find a wide selection of freshly prepared, authentic Vietnamese dishes.
- schluessel: about.p2
  de: Über Mittag (Mo bis Fr) erwartet Sie ein abwechslungsreiches Buffet. Unsere beliebten Fried Noodles stellen Sie nach Ihrem persönlichen Geschmack zusammen.
  en: At lunchtime (Mon to Fri) a varied buffet awaits you. Our popular Fried Noodles can be assembled to your personal taste.
- schluessel: about.hat
  de: Der «Nón Lá» – der traditionelle Kegelhut aus Bambus und Palmblättern, ein Wahrzeichen Vietnams.
  en: The “Nón Lá” – the traditional conical hat made of bamboo and palm leaves, an icon of Vietnam.
- schluessel: about.quote
  de: «Er wird von Menschen getragen, die im Freien arbeiten – zum Schutz vor Sonne und Regen.»
  en: “It is worn by people working outdoors – protecting them from sun and rain.”
- schluessel: about.quote-by
  de: Über den Namen Nón Lá
  en: About the name Nón Lá
- schluessel: offer.eyebrow
  de: Aktuelles & Angebot
  en: What we offer
- schluessel: offer.title
  de: Mittag & Abend
  en: Lunch & Dinner
- schluessel: offer.sub
  de: 'Ob schnelles Mittagessen, gemütlicher Abend oder zuhause: Nón Lá ist flexibel. Die Küche schliesst jeweils eine halbe Stunde vor Schluss.'
  en: A quick lunch, a cosy dinner or a night in — Nón Lá is flexible. The kitchen closes half an hour before closing time.
- schluessel: offer.lunch-title
  de: Mittagsangebot
  en: Lunch menu
- schluessel: offer.lunch-text
  de: Mo bis Fr abwechslungsreiches Buffet und kleine Karte – frisch, schnell und sättigend. Selbstbedienung an der Theke.
  en: 'Monday to Friday: a varied buffet of fresh Vietnamese dishes — quick, tasty and filling.'
