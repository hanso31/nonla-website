# ==========================================================================
# TEXTE DER WEBSITE – alle allgemeinen Texte in Deutsch (de) und Englisch (en)
# --------------------------------------------------------------------------
# Hier liegen die Texte, die auf mehreren Seiten vorkommen (Navigation,
# Fusszeile, Startseite, Bestellen, Reservieren, Catering, Wochentage).
# Die Texte der Speisekarten und des Buffets liegen in den eigenen Dateien
# (speisekarte-*.yml bzw. buffet.yml).
#
# So bearbeiten Sie diese Datei:
#   - schluessel:  NIEMALS aendern – er verbindet den Text mit der Website.
#   - de:          deutscher Text (wird auf der Website angezeigt)
#   - en:          englische Uebersetzung (Sprachschalter oben rechts)
#   - <br/> erzeugt einen Zeilenumbruch – bitte stehen lassen.
#   - &amp; steht fuer das &-Zeichen – bitte stehen lassen.
#   - <strong>...</strong> macht Text fett – bitte stehen lassen.
#
# Eintraege mit "de: null" sind zur Zeit auf keiner Seite sichtbar
# (Reste aus einer frueheren Version) und koennen ignoriert werden.
# ==========================================================================

