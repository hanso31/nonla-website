<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Menü-Test (Diagnose)</title>
<style>
  body { font-family: sans-serif; margin: 0; padding: 20px; background: #fff; color: #111; }
  h1 { font-size: 1.2rem; }
  .info { font-size: 0.8rem; color: #444; background: #eee; padding: 10px; border-radius: 8px; margin-bottom: 16px; word-break: break-all; }
  button.t { display: block; width: 100%; padding: 16px; margin: 10px 0; font-size: 1.1rem; border: 2px solid #111; border-radius: 10px; background: #fafafa; }
  .ovl { position: fixed; inset: 0; z-index: 999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .ovl .num { font-size: 40vw; font-weight: 900; }
  .ovl .x { margin-top: 20px; padding: 14px 30px; font-size: 1.2rem; background: #111; color: #fff; border: none; border-radius: 10px; }

  /* Variante 1: wie die echte Seite (opacity + transition) */
  #o1 { background: #2e7d32; color: #fff; opacity: 0; pointer-events: none; transition: opacity 0.4s ease; }
  #o1.on { opacity: 1; pointer-events: auto; }

  /* Variante 2: mit backdrop-filter */
  #o2 { background: rgba(21, 101, 192, 0.94); color: #fff; opacity: 0; pointer-events: none; transition: opacity 0.4s ease; backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); }
  #o2.on { opacity: 1; pointer-events: auto; }

  /* Variante 3: display statt opacity (kein Übergang) */
  #o3 { background: #c62828; color: #fff; display: none; }
  #o3.on { display: flex; }

  /* Variante 4: opacity ohne transition (sofort sichtbar) */
  #o4 { background: #ef6c00; color: #fff; opacity: 0; pointer-events: none; }
  #o4.on { opacity: 1; pointer-events: auto; }
</style>
</head>
<body>
  <h1>Menü-Test</h1>
  <div class="info" id="info">lade…</div>
  <p>Tippe der Reihe nach auf alle 4 Buttons und merke dir, <b>welche Zahl</b> jeweils als Vollbild erscheint (und welche nicht). Dann schliessen und mir melden, z.&nbsp;B. „1 ja, 2 nein, 3 ja, 4 ja".</p>
  <button class="t" data-o="o1">Test 1: Menü wie auf der Seite</button>
  <button class="t" data-o="o2">Test 2: mit Blur-Effekt</button>
  <button class="t" data-o="o3">Test 3: ohne Animation</button>
  <button class="t" data-o="o4">Test 4: Opacity ohne Übergang</button>

  <div class="ovl" id="o1"><div class="num">1</div><button class="x">Schliessen</button></div>
  <div class="ovl" id="o2"><div class="num">2</div><button class="x">Schliessen</button></div>
  <div class="ovl" id="o3"><div class="num">3</div><button class="x">Schliessen</button></div>
  <div class="ovl" id="o4"><div class="num">4</div><button class="x">Schliessen</button></div>

<script>
  document.querySelectorAll("button.t").forEach(function (b) {
    b.addEventListener("click", function () {
      document.getElementById(b.dataset.o).classList.add("on");
    });
  });
  document.querySelectorAll(".ovl .x").forEach(function (b) {
    b.addEventListener("click", function () {
      b.closest(".ovl").classList.remove("on");
    });
  });
  (function () {
    var info = document.getElementById("info");
    var ua = navigator.userAgent;
    fetch("index.html", { cache: "no-store" }).then(function (r) { return r.text(); }).then(function (html) {
      var m = html.match(/script-v2\.js\?v=(\d+)/);
      var c = html.match(/styles-v2\.css\?v=(\d+)/);
      info.textContent = "Version auf diesem Gerät → Script: " + (m ? m[1] : "?") +
        " | CSS: " + (c ? c[1] : "?") + " | UA: " + ua;
    }).catch(function (e) {
      info.textContent = "Version unbekannt (" + e + ") | UA: " + ua;
    });
  })();
</script>
</body>
</html>
