              - {label: "Buffet-Serviert-Text", name: served, widget: object, fields: [{label: Deutsch, name: de, widget: text}, {label: Englisch, name: en, widget: text}]}
              - {label: "Buffet-Legende", name: buffet-legend, widget: object, fields: [{label: Deutsch, name: de, widget: text}, {label: Englisch, name: en, widget: text}]}
