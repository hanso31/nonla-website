              - {label: "Titel", name: title, widget: object, fields: [{label: Deutsch, name: de, widget: string}, {label: Englisch, name: en, widget: string}]}
              - {label: "Einleitung", name: lead, widget: object, fields: [{label: Deutsch, name: de, widget: text}, {label: Englisch, name: en, widget: text}]}
              - {label: "Notiz glutenfrei", name: note1, widget: object, fields: [{label: Deutsch, name: de, widget: text}, {label: Englisch, name: en, widget: text}]}
              - {label: "Notiz MwSt.", name: note2, widget: object, fields: [{label: Deutsch, name: de, widget: string}, {label: Englisch, name: en, widget: string}]}
              - {label: "Notiz Herkunft", name: note3, widget: object, fields: [{label: Deutsch, name: de, widget: string}, {label: Englisch, name: en, widget: string}]}
              - {label: "Notiz WLAN", name: note4, widget: object, fields: [{label: Deutsch, name: de, widget: string}, {label: Englisch, name: en, widget: string}]}
              - {label: "Original-Karte (Aufklapp-Titel)", name: original, widget: object, fields: [{label: Deutsch, name: de, widget: string}, {label: Englisch, name: en, widget: string}]}
