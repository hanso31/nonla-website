              - {label: Englisch, name: en, widget: text, required: false}

  # ------------------------------------------------------------------------
  - name: oeffnungszeiten
    label: Öffnungszeiten
    files:
      - name: zeiten
        label: Öffnungszeiten bearbeiten
        file: content/oeffnungszeiten.yml
        fields:
          - label: Kitchen Spalenbrunnen (Startseite)
            name: standorte
            widget: object
            fields:
              - label: Kitchen Spalenbrunnen
                name: spalenbrunnen
                widget: object
                collapsed: true
                fields:
                  - label: Zeilen
                    name: zeilen
                    widget: list
                    label_singular: Zeile
                    summary: "{{fields.tage}} – {{fields.zeit}}"
                    fields:
                      - {label: "Tage", name: tage, widget: select, options: [{label: "Mo", value: days.mo}, {label: "Mo – Fr", value: days.mofr}, {label: "Mo – Do", value: days.modo}, {label: "Fr", value: days.fr}, {label: "Sa", value: days.sa}, {label: "So", value: days.so}, {label: "Di – Sa", value: days.disa}, {label: "Sa – So", value: days.saso}]}
                      - {label: "Zeit", name: zeit, widget: string, required: false, hint: "z. B. 11:30 – 14:00 (leer bei Ruhetag)"}
                      - {label: "Geschlossen (Ruhetag)", name: geschlossen, widget: boolean, required: false, default: false}
              - label: Streetfood Markthalle
                name: markthalle
                widget: object
                collapsed: true
                fields:
                  - label: Zeilen
                    name: zeilen
                    widget: list
                    label_singular: Zeile
                    summary: "{{fields.tage}} – {{fields.zeit}}"
                    fields:
                      - {label: "Tage", name: tage, widget: select, options: [{label: "Mo", value: days.mo}, {label: "Mo – Fr", value: days.mofr}, {label: "Mo – Do", value: days.modo}, {label: "Fr", value: days.fr}, {label: "Sa", value: days.sa}, {label: "So", value: days.so}, {label: "Di – Sa", value: days.disa}, {label: "Sa – So", value: days.saso}]}
                      - {label: "Zeit", name: zeit, widget: string, required: false, hint: "z. B. 11:30 – 14:00 (leer bei Ruhetag)"}
                      - {label: "Geschlossen (Ruhetag)", name: geschlossen, widget: boolean, required: false, default: false}
              - label: Corner Klara
                name: klara
                widget: object
                collapsed: true
                fields:
                  - label: Zeilen
                    name: zeilen
                    widget: list
                    label_singular: Zeile
                    summary: "{{fields.tage}} – {{fields.zeit}}"
                    fields:
                      - {label: "Tage", name: tage, widget: select, options: [{label: "Mo", value: days.mo}, {label: "Mo – Fr", value: days.mofr}, {label: "Mo – Do", value: days.modo}, {label: "Fr", value: days.fr}, {label: "Sa", value: days.sa}, {label: "So", value: days.so}, {label: "Di – Sa", value: days.disa}, {label: "Sa – So", value: days.saso}]}
                      - {label: "Zeit", name: zeit, widget: string, required: false, hint: "z. B. 11:30 – 14:00 (leer bei Ruhetag)"}
                      - {label: "Geschlossen (Ruhetag)", name: geschlossen, widget: boolean, required: false, default: false}
          - label: Bestellzeiten (Seite «Online bestellen»)
            name: bestellzeiten
            widget: list
            label_singular: Zeile
            summary: "{{fields.tage}} – {{fields.zeit}}"
            fields:
