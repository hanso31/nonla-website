              - {label: "Hinweis «wechselnd»", name: changing, widget: object, fields: [{label: Deutsch, name: de, widget: text}, {label: Englisch, name: en, widget: text}]}
              - {label: "Buffet-Titel", name: buffet-title, widget: object, fields: [{label: Deutsch, name: de, widget: string}, {label: Englisch, name: en, widget: string}]}
