  # ------------------------------------------------------------------------
  - name: speisekarte_abend
    label: Speisekarte Spalenbrunnen abends
    files:
      - name: abend
        label: Spalenbrunnen abends bearbeiten
        file: content/speisekarte-spalenbrunnen-abend.yml
        fields:
          - {label: Präfix, name: prefix, widget: hidden}
          - {label: Codes, name: codes, widget: hidden}
          - label: Texte der Seite
            name: texte
            widget: object
