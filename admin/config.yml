# ==========================================================================
# Decap CMS – Konfiguration für die Nón Lá-Website
# --------------------------------------------------------------------------
# Diese Datei steuert das Bearbeitungs-Formular unter /admin.
# Sie wird nur vom CMS gelesen; die Inhalte liegen im Ordner content/.
# ==========================================================================

backend:
  name: github
  # GitHub-Benutzername und Repositoryname eintragen, z. B.:
  # repo: mein-benutzer/nonla-website
  repo: BITTE-EINTRAGEN/nonla-website
  branch: main
  # Adresse des OAuth-Proxy (Cloudflare Worker) aus Schritt 3 der README
  base_url: https://BITTE-EINTRAGEN.workers.dev

locale: de

# Bilder landen im Ordner images/ und werden von dort verlinkt.
media_folder: images
public_folder: images

collections:

  # ------------------------------------------------------------------------
  - name: buffet
    label: Wochenbuffet (Mo–Fr)
    description: Mittagsbuffet Spalenbrunnen – die Gerichte der Wochenkarte.
    files:
      - name: buffet
        label: Wochenbuffet bearbeiten
        file: content/buffet.yml
        fields:
          - label: Wochentage
            name: tage
            widget: list
            allow_add: false
            label_singular: Tag
            summary: "{{fields.tag_de}}"
            fields:
              - {label: "Kürzel (bitte nicht ändern)", name: id, widget: hidden}
              - {label: "Tag (deutsch)", name: tag_de, widget: string}
              - {label: "Tag (englisch)", name: tag_en, widget: string}
              - {label: "Preiszeile", name: preis, widget: string, hint: "Wird unter den Gerichten angezeigt, z. B. 17.– | 18.– CHF"}
              - label: Gerichte
                name: gerichte
                widget: list
                label_singular: Gericht
                summary: "{{fields.de}}"
                minimize_collapsed: true
                fields:
                  - {label: "Gericht (deutsch)", name: de, widget: string}
                  - {label: "Gericht (englisch)", name: en, widget: string}
                  - {label: "Unterzeile (deutsch)", name: sub_de, widget: string, hint: "z. B. «mit Rind, Poulet, Ente oder Tofu»"}
                  - {label: "Unterzeile (englisch)", name: sub_en, widget: string}

  # ------------------------------------------------------------------------
  - name: speisekarte_markthalle
    label: Speisekarte Alte Markthalle
    files:
      - name: markthalle
        label: Alte Markthalle bearbeiten
        file: content/speisekarte-markthalle.yml
        fields:
          - {label: Präfix, name: prefix, widget: hidden}
          - {label: Codes, name: codes, widget: hidden}
          - label: Texte der Seite
            name: texte
            widget: object
            collapsed: true
            fields:
              - {label: "Brotkrume", name: crumb, widget: object, fields: [{label: Deutsch, name: de, widget: string}, {label: Englisch, name: en, widget: string}]}
              - {label: "Überzeile (Eyebrow)", name: eyebrow, widget: object, fields: [{label: Deutsch, name: de, widget: string}, {label: Englisch, name: en, widget: string}]}
              - {label: "Titel", name: title, widget: object, fields: [{label: Deutsch, name: de, widget: string}, {label: Englisch, name: en, widget: string}]}
              - {label: "Einleitung", name: lead, widget: object, fields: [{label: Deutsch, name: de, widget: text}, {label: Englisch, name: en, widget: text}]}
              - {label: "Legende vgm", name: legend1, widget: object, fields: [{label: Deutsch, name: de, widget: string}, {label: Englisch, name: en, widget: string}]}
              - {label: "Legende glutenfrei", name: legend2, widget: object, fields: [{label: Deutsch, name: de, widget: text}, {label: Englisch, name: en, widget: text}]}
              - {label: "Button «Online bestellen»", name: order, widget: object, fields: [{label: Deutsch, name: de, widget: string}, {label: Englisch, name: en, widget: string}]}
              - {label: "Button «Alle Standorte»", name: all-loc, widget: object, fields: [{label: Deutsch, name: de, widget: string}, {label: Englisch, name: en, widget: string}]}
          - label: Kategorien und Gerichte
            name: kategorien
            widget: list
            allow_add: false
            label_singular: Kategorie
            summary: "{{fields.name_de}}"
            minimize_collapsed: true
            fields:
              - {label: "Kürzel (bitte nicht ändern)", name: id, widget: hidden}
              - {label: "i18n (bitte nicht ändern)", name: i18n, widget: hidden, required: false}
              - {label: "Name (deutsch)", name: name_de, widget: string, required: false}
              - {label: "Name (englisch)", name: name_en, widget: string, required: false}
              - label: Gerichte
                name: gerichte
                widget: list
                label_singular: Gericht
                summary: "{{fields.code}} {{fields.name}}"
                minimize_collapsed: true
                fields:
                  - {label: "Schlüssel (eindeutig, nur Kleinbuchstaben – z. B. a5)", name: id, widget: string}
                  - {label: "Darstellung", name: layout, widget: select, options: [{label: "Mit Bild", value: bild}, {label: "Ohne Bild", value: einfach}], default: bild}
                  - {label: Bild, name: bild, widget: image, required: false}
                  - {label: "Bildbeschreibung (alt)", name: alt, widget: string, required: false}
                  - {label: "Code (z. B. A1)", name: code, widget: string, required: false}
                  - {label: "Name (vietnamesisch, Grossbuchstaben)", name: name, widget: string}
                  - {label: "Beschreibung (deutsch)", name: text_de, widget: text}
                  - {label: "Beschreibung (englisch)", name: text_en, widget: text}
                  - {label: "Preis (leer lassen = keine Preiszeile)", name: preis, widget: string, required: false, hint: "z. B. 15 CHF oder 15.50 | 16.50 CHF"}
                  - {label: "Preis-Zusatz (klein gedruckt)", name: preis_zusatz, widget: string, required: false, hint: "z. B. 2 Stück"}
                  - {label: "Leere Preiszeile (Abstandshalter)", name: preis_leerzeile, widget: boolean, required: false, default: false}
                  - {label: "Hinweiszeile (deutsch)", name: tags_de, widget: string, required: false, hint: "z. B. vt · vg"}
                  - {label: "Hinweiszeile (englisch)", name: tags_en, widget: string, required: false}
                  - {label: "Verschachtelte Schlüssel (bitte nicht ändern)", name: tags_extra, widget: hidden, required: false}
                  - {label: "Varianten (bitte nicht ändern)", name: varianten, widget: hidden, required: false}

  # ------------------------------------------------------------------------
  - name: speisekarte_klara
    label: Speisekarte Klara
    files:
      - name: klara
        label: Klara bearbeiten
        file: content/speisekarte-klara.yml
        fields:
          - {label: Präfix, name: prefix, widget: hidden}
          - {label: Codes, name: codes, widget: hidden}
          - label: Texte der Seite
            name: texte
            widget: object
            collapsed: true
            fields:
              - {label: "Kategorietitel", name: cat, widget: object, fields: [{label: Deutsch, name: de, widget: string}, {label: Englisch, name: en, widget: string}]}
              - {label: "Brotkrume", name: crumb, widget: object, fields: [{label: Deutsch, name: de, widget: string}, {label: Englisch, name: en, widget: string}]}
              - {label: "Überzeile (Eyebrow)", name: eyebrow, widget: object, fields: [{label: Deutsch, name: de, widget: string}, {label: Englisch, name: en, widget: string}]}
              - {label: "Einleitung", name: lead, widget: object, fields: [{label: Deutsch, name: de, widget: text}, {label: Englisch, name: en, widget: text}]}
              - {label: "Titel", name: title, widget: object, fields: [{label: Deutsch, name: de, widget: string}, {label: Englisch, name: en, widget: string}]}
          - label: Kategorien und Gerichte
            name: kategorien
            widget: list
            allow_add: false
            label_singular: Kategorie
            summary: "{{fields.id}}"
            fields:
              - {label: "Kürzel (bitte nicht ändern)", name: id, widget: hidden}
              - {label: "i18n (bitte nicht ändern)", name: i18n, widget: hidden, required: false}
              - {label: "Name (deutsch)", name: name_de, widget: string, required: false}
              - {label: "Name (englisch)", name: name_en, widget: string, required: false}
              - label: Gerichte
                name: gerichte
                widget: list
                label_singular: Gericht
                summary: "{{fields.name}}"
                minimize_collapsed: true
                fields:
                  - {label: "Schlüssel (eindeutig, nur Kleinbuchstaben – z. B. d8)", name: id, widget: string}
                  - {label: "Darstellung", name: layout, widget: select, options: [{label: "Mit Bild", value: bild}, {label: "Ohne Bild", value: einfach}], default: bild}
                  - {label: Bild, name: bild, widget: image, required: false}
                  - {label: "Bildbeschreibung (alt)", name: alt, widget: string, required: false}
                  - {label: "Code", name: code, widget: string, required: false}
                  - {label: "Name (vietnamesisch, Grossbuchstaben)", name: name, widget: string}
                  - {label: "Beschreibung (deutsch)", name: text_de, widget: text}
                  - {label: "Beschreibung (englisch)", name: text_en, widget: text}
                  - {label: "Preis (leer lassen = keine Preiszeile)", name: preis, widget: string, required: false, hint: "z. B. 9 CHF"}
                  - {label: "Preis-Zusatz (klein gedruckt)", name: preis_zusatz, widget: string, required: false, hint: "z. B. 2 Stück"}
                  - {label: "Leere Preiszeile (Abstandshalter)", name: preis_leerzeile, widget: boolean, required: false, default: false}
                  - {label: "Hinweiszeile (deutsch)", name: tags_de, widget: string, required: false, hint: "z. B. vt · vg"}
                  - {label: "Hinweiszeile (englisch)", name: tags_en, widget: string, required: false}
                  - {label: "Verschachtelte Schlüssel (bitte nicht ändern)", name: tags_extra, widget: hidden, required: false}
                  - {label: "Varianten (bitte nicht ändern)", name: varianten, widget: hidden, required: false}

  # ------------------------------------------------------------------------
  - name: speisekarte_mittag
    label: Speisekarte Spalenbrunnen mittags
    description: Kleine Karte mittags – das Buffet wird separat unter «Wochenbuffet» gepflegt.
    files:
      - name: mittag
        label: Spalenbrunnen mittags bearbeiten
